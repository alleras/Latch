name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            runner: macos-latest
            command: npm run package:mac
          - platform: windows-x64
            runner: windows-latest
            command: npm run package:win:x64
          - platform: windows-arm64
            runner: windows-11-arm
            command: npm run package:win:arm64
          - platform: linux
            runner: ubuntu-latest
            command: npm run package:linux

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: ${{ matrix.command }}

      - name: Test Windows installation
        if: startsWith(matrix.platform, 'windows-')
        timeout-minutes: 5
        shell: pwsh
        env:
          LATCH_BUILD_PLATFORM: ${{ matrix.platform }}
        run: ./scripts/test-windows-installer.ps1 -Architecture ($env:LATCH_BUILD_PLATFORM -replace '^windows-', '')

      - name: Test Windows title bar and menu
        if: startsWith(matrix.platform, 'windows-')
        timeout-minutes: 3
        run: npx --no-install electron scripts/test-window-chrome.cjs

      - name: Upload Windows title bar screenshots
        if: always() && startsWith(matrix.platform, 'windows-')
        uses: actions/upload-artifact@v4
        with:
          name: window-chrome-${{ matrix.platform }}-${{ github.run_id }}
          path: release/window-chrome-*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: latch-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: latch-*-${{ github.run_id }}
          path: artifacts

      - name: Validate assets and create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find artifacts -type f -print0)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No release assets found."
            exit 1
          fi
          duplicate_names=$(for file in "${files[@]}"; do printf '%s\n' "${file##*/}"; done | LC_ALL=C sort | uniq -d)
          if [[ -n "$duplicate_names" ]]; then
            echo "::error::Duplicate release asset filenames; each filename must be unique across packaging jobs."
            printf '%s\n' "$duplicate_names"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --generate-notes \
            --title "Latch $GITHUB_REF_NAME"
